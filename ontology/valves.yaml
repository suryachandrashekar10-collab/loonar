pressure_classes:  # ASME B16.34 / API 6D
  ascending_order:
    - "Class 150"
    - "Class 300"
    - "Class 600"
    - "Class 900"
    - "Class 1500"
    - "Class 2500"
  note: "Offering higher class than specified is typically acceptable (conservative). Lower class is always a deviation."

