    - code: "ASME B16.47"
      scope: "Large diameter flanges (Class 150-900, NPS 26-60)"
    - code: "EN 1092-1"
      scope: "European flanges"

common_deviation_patterns:
  - trigger: "low temperature rating below -46°C"
    pattern: "Standard ASTM A350 LF2 is certified to -46°C. Extension to {temp}°C requires additional Charpy V-notch impact testing per ASTM A370."
    risk: high

  - trigger: "ASME Section I (Power Boilers) certification"
    pattern: "Standard product line is certified under ASME Section VIII. Section I requires separate design qualification, welder requalification, and NDE procedures. Lead time impact: +6-10 weeks."
    risk: critical

  - trigger: "helium leak testing"
    pattern: "Standard test is hydrostatic per API 598. Helium leak test requires specialized equipment and adds {cost_delta} and {time_delta} to the test program."
    risk: medium

  - trigger: "100% radiographic testing"
    pattern: "Standard casting inspection is 10% RT per ASME B16.34. 100% RT increases cost by approximately 15-20% and extends lead time by 2-3 weeks."
    risk: medium

  - trigger: "fire-safe certification API 6FA or API 607"
    pattern: "Fire-safe testing per API 6FA/607 requires third-party witnessed test. Vendor offers fire-safe design; certified test report available upon request."
    risk: low

  - trigger: "fugitive emissions low-E"
    pattern: "Fugitive emissions compliance per ISO 15848 / TA-Luft requires specific stem seal qualification. Standard product uses graphite packing which qualifies for Class AH (ISO 15848) or VDI 2440 Class 2."
    risk: medium

  - trigger: "anti-static device"
    pattern: "Anti-static device is standard feature. Complies with API 6D / ASME B16.34 requirements."
    risk: low

  - trigger: "oxygen service"
    pattern: "Oxygen service requires dedicated cleaning per ASTM G93 / EIGA Doc 33, PTFE or special elastomer seats, and degreased assembly in a clean room environment. Not included in standard scope."
    risk: critical
