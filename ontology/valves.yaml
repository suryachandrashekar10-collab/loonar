      scope: "Pipeline valves (ball, gate, check)"
    - code: "API 600"
      scope: "Steel gate valves"
    - code: "API 602"
      scope: "Compact steel gate valves"
    - code: "API 608"
      scope: "Metal ball valves"
    - code: "ASME B16.34"
      scope: "Valves — flanged, threaded, welding end"
    - code: "EN 13709"
      scope: "European steel globe and check valves"
    - code: "EN 13851"
      scope: "European butterfly valves"
  testing:
    - code: "API 598"
      scope: "Valve inspection and testing"
    - code: "API 6FA"
      scope: "Fire testing of valves"
    - code: "ISO 5208"
      scope: "Industrial valves — pressure testing"
    - code: "BS 6755"
      scope: "Testing of valves (UK/EU)"
  face_to_face:
